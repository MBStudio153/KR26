name: gdelt-banking-data2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - batch: 'bank_failure'
            terms: '[["banking_stability", "bank failure"]]'
          - batch: 'bank_run'
            terms: '[["banking_stability", "bank run"]]'
          - batch: 'credit_crunch'
            terms: '[["banking_stability", "credit crunch"]]'
          - batch: 'fdic'
            terms: '[["banking_stability", "FDIC"]]'
    steps:
      - uses: actions/checkout@v4
      - name: GDELT DOC API, one term per run, retry of terms that hit rate limits, daily raw counts 2017 to present
        continue-on-error: true
        env:
          TERMS_JSON: ${{ matrix.terms }}
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import json, os, random, re, time, urllib.request, urllib.parse
          BASE = "https://api.gdeltproject.org/api/v2/doc/doc"
          pairs = json.loads(os.environ["TERMS_JSON"])
          log = open("out/log.txt", "w")
          time.sleep(random.random() * 90)
          def get(url):
              err = ""
              for a in range(6):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "kaim-research/1.0"})
                      r = urllib.request.urlopen(req, timeout=180).read().decode("utf-8", "replace")
                      if r.startswith("{"):
                          return r
                      err = r[:80]
                  except Exception as e:
                      err = repr(e)[:120]
                  time.sleep(150 * (a + 1))
              return "ERROR " + err
          def call(term, start, end):
              params = {"query": '"%s" sourcelang:english' % term, "mode": "timelinevolraw", "format": "json", "timelinesmooth": "0",
                        "startdatetime": start, "enddatetime": end}
              return get(BASE + "?" + urllib.parse.urlencode(params))
          def wait():
              time.sleep(60 + random.random() * 30)
          now = time.strftime("%Y%m%d235959")
          for cat, term in pairs:
              slug = re.sub(r"[^a-z0-9]+", "_", term.lower()).strip("_")
              r = call(term, "20170101000000", now)
              wait()
              log.write("%s | %s | full-span len=%d %s\n" % (cat, term, len(r), r[:60].replace("\n", " ")))
              if r.startswith("{"):
                  open("out/%s__%s.json" % (cat, slug), "w").write(r)
              else:
                  for yr in range(2017, 2027):
                      end = "%d1231235959" % yr if yr < 2026 else now
                      r = call(term, "%d0101000000" % yr, end)
                      open("out/%s__%s_%d.json" % (cat, slug, yr), "w").write(r)
                      log.write("%s | %s | %d len=%d %s\n" % (cat, term, yr, len(r), r[:60].replace("\n", " ")))
                      log.flush()
                      wait()
              log.flush()
          PY
          python3 q.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdelt-banking2-${{ matrix.batch }}
          path: out/
  collect:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gdelt-banking2-*
          path: all
      - name: Zip and commit
        run: |
          mkdir -p data/zips
          cd all && zip -r ../data/zips/gdelt-banking-data2.zip . && cd ..
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/zips/gdelt-banking-data2.zip
          git commit -m "Fetch GDELT attention counts in batches" || true
          git push || true

